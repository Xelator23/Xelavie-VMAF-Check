name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test offline logic and local UI server
        run: python -B -m unittest discover -s . -p "test_*.py" -v
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel into clean environment
        shell: bash
        run: |
          python -m venv .package-test
          if [ "$RUNNER_OS" = Windows ]; then
            py=.package-test/Scripts/python.exe
          else
            py=.package-test/bin/python
          fi
          "$py" -m pip install --no-deps dist/*.whl
          "$py" -I packaging_smoke.py
